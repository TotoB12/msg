<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>msg | Simple P2P Chat & File Transfer</title>
    <link rel="stylesheet" href="style.css">
    <!-- Include PeerJS library -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- Include Socket.IO client library -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <!-- Include Marked library for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Include DOMPurify for sanitizing HTML -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.11"></script>
    <!-- Include UUID library (for unique file IDs) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/uuid/8.3.2/uuid.min.js"></script>
</head>
<body>
    <div id="chat-container">
        <h1>msg</h1>
        <div id="status">Connecting...</div>
        <div id="messages">
            <!-- Messages and file transfers will appear here -->
        </div>
        <!-- Area to display files staged for sending -->
        <div id="staged-files-display"></div>
        <div id="input-area">
            <!-- Hidden file input -->
            <input type="file" id="file-input" multiple style="display: none;">
            <!-- Visible trigger button -->
            <button id="upload-button" title="Attach files (Max 100 files, 500MB each)">📎</button>
            <input type="text" id="message-input" placeholder="Type message or attach files..." autocomplete="off">
            <button id="send-button">Send</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
